<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>DZB Hub — Student Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1B2D; --ink2:#17273D; --ink3:#22364f;
  --canvas:#F4F3EE; --surface:#FFFFFF; --surface2:#FAF9F5;
  --line:#E4E2D8; --line2:#EEEDE6;
  --jade:#1C7C6C; --jade-d:#14655A; --jade-soft:#E3F0ED;
  --gold:#B0842B; --gold-soft:#F6EED9;
  --danger:#C0392B; --danger-soft:#F7E4E1;
  --text:#182231; --muted:#6A7480; --faint:#9AA3AE;
  --radius:12px; --radius-s:8px;
  --shadow:0 1px 2px rgba(15,27,45,.06),0 8px 24px rgba(15,27,45,.05);
  --shadow-lg:0 12px 40px rgba(15,27,45,.18);
  --disp:'Space Grotesk',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--body);background:var(--canvas);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--jade);text-decoration:none}
button{font-family:inherit;cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:var(--disp);margin:0;font-weight:600;letter-spacing:-.01em}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:236px 1fr;height:100vh;overflow:hidden}
.side{background:var(--ink);color:#C9D2DE;display:flex;flex-direction:column;padding:0;border-right:1px solid #0a1420}
.brand{padding:20px 20px 16px;display:flex;align-items:center;gap:11px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--jade),#2aa38c);display:grid;place-items:center;font-family:var(--disp);font-weight:700;color:#fff;font-size:15px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.brand b{font-family:var(--disp);color:#fff;font-size:16px;font-weight:600;letter-spacing:-.02em;display:block;line-height:1.1}
.brand span{font-size:10.5px;color:#7B8798;letter-spacing:.14em;text-transform:uppercase}
.nav{padding:8px 12px;flex:1;overflow-y:auto}
.nav .grp{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#5C6B7E;padding:16px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:#AEB9C7;font-weight:500;font-size:13.5px;margin-bottom:2px;transition:.13s;position:relative}
.nav a svg{width:17px;height:17px;stroke-width:1.8;flex:none;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.05);color:#EAF0F6}
.nav a.on{background:var(--jade);color:#fff}
.nav a.on svg{opacity:1}
.nav a .badge{margin-left:auto;background:rgba(255,255,255,.14);color:#fff;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:20px;font-family:var(--mono)}
.nav a.on .badge{background:rgba(255,255,255,.24)}
.side-foot{padding:12px;border-top:1px solid #17273D}
.side-close{display:none;margin-left:auto;width:32px;height:32px;place-items:center;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#C9D2DE;cursor:pointer;flex:none}
.side-close:hover{background:rgba(255,255,255,.16)}
.side-close svg{width:16px;height:16px}
.sync-badge{font-size:11px;font-weight:600;text-align:center;padding:5px;border-radius:7px;margin-bottom:8px;background:rgba(255,255,255,.05);color:#8A94A6}
.sync-badge.ok{background:rgba(28,124,108,.22);color:#7FE0CE}
.sync-badge.syncing{background:rgba(176,132,43,.22);color:#E7C486}
.sync-badge.offline,.sync-badge.error{background:rgba(192,57,43,.22);color:#F0A79E}
.side-foot button{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);color:#C9D2DE;padding:8px;border-radius:8px;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:6px}
.side-foot button:hover{background:rgba(255,255,255,.11)}
.side-foot button svg{width:14px;height:14px}

/* ---------- Main ---------- */
.main{overflow-y:auto;height:100vh;position:relative}
.topbar{position:sticky;top:0;z-index:40;background:rgba(244,243,238,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 30px;display:flex;align-items:center;gap:16px}
.topbar .ttl{flex:none}
.topbar .ttl h1{font-size:20px;font-weight:600}
.topbar .ttl p{margin:1px 0 0;font-size:12px;color:var(--muted)}
.search{margin-left:auto;position:relative;width:290px;max-width:38vw}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:13px;font-family:inherit}
.search input:focus{outline:none;border-color:var(--jade);box-shadow:0 0 0 3px var(--jade-soft)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint)}
.search .drop{position:absolute;top:44px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);max-height:340px;overflow-y:auto;display:none;z-index:60}
.search .drop.open{display:block}
.search .drop b{display:block;padding:7px 12px 4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.search .drop .row{padding:8px 12px;display:flex;align-items:center;gap:9px;font-size:13px}
.search .drop .row:hover{background:var(--surface2)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:9px 14px;border-radius:9px;font-weight:550;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:.13s}
.btn:hover{border-color:#cfccc0;background:var(--surface2)}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--jade);border-color:var(--jade);color:#fff}
.btn.pri:hover{background:var(--jade-d);border-color:var(--jade-d)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line2)}
.btn.dng{color:var(--danger)}
.btn.dng:hover{background:var(--danger-soft);border-color:var(--danger-soft)}

.view{padding:24px 30px 60px;max-width:1320px}
.hidden{display:none!important}

/* ---------- Cards / KPIs ---------- */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,1fr)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .lab{font-size:11.5px;color:var(--muted);font-weight:550;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.kpi .lab svg{width:14px;height:14px;color:var(--faint)}
.kpi .val{font-family:var(--disp);font-size:27px;font-weight:600;margin-top:8px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.kpi .sub.up{color:var(--jade)}.kpi .sub.dn{color:var(--danger)}
.kpi.accent{background:linear-gradient(160deg,var(--ink),var(--ink2));border-color:var(--ink)}
.kpi.accent .lab,.kpi.accent .sub{color:#9FB0C4}.kpi.accent .lab svg{color:#7C8DA3}
.kpi.accent .val{color:#fff}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel-h{padding:15px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.panel-h h3{font-size:15px;font-weight:600}
.panel-h .sub{font-size:12px;color:var(--muted)}
.panel-h .act{margin-left:auto;display:flex;gap:8px}
.panel-b{padding:16px 18px}

/* pipeline funnel */
.funnel{display:flex;flex-direction:column;gap:7px}
.frow{display:grid;grid-template-columns:150px 1fr 44px;align-items:center;gap:12px}
.frow .fl{font-size:12.5px;font-weight:550;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.fbar{height:22px;border-radius:6px;background:var(--line2);overflow:hidden}
.fbar i{display:block;height:100%;border-radius:6px}
.fn{font-family:var(--mono);font-size:13px;font-weight:600;text-align:right}

/* ---------- Table ---------- */
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2);position:sticky;top:0}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr{transition:.1s}
tbody tr:hover{background:var(--surface2)}
tbody tr.clk{cursor:pointer}
td .nm{font-weight:600}
td .sub{font-size:11.5px;color:var(--muted)}
.idcell{font-family:var(--mono);color:var(--faint);font-size:12px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip .cdot{width:7px;height:7px;border-radius:50%}
.pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--line2);color:var(--muted)}
.prio{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:5px}
.prio.HIGH{background:var(--danger-soft);color:var(--danger)}
.prio.MID{background:var(--gold-soft);color:var(--gold)}
.prio.LOW{background:#E7EDF2;color:#5B7185}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;background:var(--line2);border-radius:9px;padding:3px}
.seg button{border:none;background:transparent;padding:6px 13px;border-radius:7px;font-size:12.5px;font-weight:550;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
select,input[type=text],input[type=date],input[type=number],textarea{font-family:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text)}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--jade);box-shadow:0 0 0 3px var(--jade-soft)}
.filt{padding:7px 10px}

/* ---------- Drawer / Modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,27,45,.42);backdrop-filter:blur(2px);z-index:110;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:520px;max-width:94vw;background:var(--canvas);z-index:140;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer-h{padding:18px 22px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:flex-start;gap:12px}
.drawer-h .x{margin-left:auto;background:var(--line2);border:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.drawer-h .x:hover{background:#e2e0d6}
.drawer-b{padding:20px 22px;overflow-y:auto;flex:1 1 auto;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-46%);z-index:140;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);width:560px;max-width:94vw;max-height:90vh;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:.2s}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line2);display:flex;align-items:center;flex:0 0 auto}
.modal-h h3{font-size:17px}
.modal-h .x{margin-left:auto;background:var(--line2);border:none;width:30px;height:30px;border-radius:8px;color:var(--muted)}
.modal-b{padding:20px 22px;overflow-y:auto;flex:1 1 auto;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.modal-f{padding:14px 22px;border-top:1px solid var(--line2);display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;flex:0 0 auto;background:var(--surface2);border-radius:0 0 16px 16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.02em}
.field input,.field select,.field textarea{width:100%}
.field textarea{min-height:70px;resize:vertical}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* detail drawer bits */
.dsec{margin-bottom:22px}
.dsec .st{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:9px}
.kv{display:grid;grid-template-columns:118px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{margin:0;font-weight:500}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px}
.mini .top{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.mini .bd{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty svg{width:34px;height:34px;color:var(--faint);margin-bottom:10px}
.empty h4{font-size:15px;color:var(--text);margin-bottom:4px}

/* ---------- Tasks kanban ---------- */
.kan{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.kcol{background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius);min-height:120px}
.kcol-h{padding:12px 14px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;border-bottom:1px solid var(--line2)}
.kcol-h .cnt{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--line2);padding:1px 8px;border-radius:20px}
.kcol-b{padding:11px;display:flex;flex-direction:column;gap:9px;min-height:60px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:var(--shadow);cursor:pointer;transition:.12s}
.tcard:hover{border-color:#cfccc0;transform:translateY(-1px)}
.tcard .th{font-weight:600;font-size:13px;line-height:1.35;margin-bottom:7px}
.tcard .tm{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.tcard .av{width:20px;height:20px;border-radius:50%;background:var(--jade-soft);color:var(--jade-d);display:grid;place-items:center;font-size:10px;font-weight:700}
.tcard.drag{opacity:.4}
.kcol.over{outline:2px dashed var(--jade);outline-offset:-4px}
.due{font-family:var(--mono);font-size:11px;font-weight:600}
.due.over{color:var(--danger)}.due.soon{color:var(--gold)}

/* ---------- Calendar ---------- */
.cal-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cal-h h3{font-size:18px;min-width:180px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cal-dow{background:var(--surface2);padding:9px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center}
.cal-cell{background:var(--surface);min-height:104px;padding:7px 8px;position:relative}
.cal-cell.off{background:var(--surface2);color:var(--faint)}
.cal-cell .dn{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted)}
.cal-cell.today .dn{background:var(--jade);color:#fff;border-radius:6px;padding:1px 6px}
.cal-ev{font-size:10.5px;padding:2px 6px;border-radius:5px;margin-top:4px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cal-ev.task{background:var(--jade-soft);color:var(--jade-d)}
.cal-ev.file{background:var(--gold-soft);color:var(--gold)}
.cal-ev.op{background:#E7EDF2;color:#42627d}
.cal-ev.appt{background:#EDE7F6;color:#6D5AC9}
.cal-ev.appt[draggable=true]{cursor:grab}
.cal-ev.appt[draggable=true]:active{cursor:grabbing}
.cal-cell.drop-over{background:var(--jade-soft);outline:2px dashed var(--jade);outline-offset:-3px}
.cal-add{float:right;width:18px;height:18px;line-height:15px;text-align:center;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--muted);font-size:14px;cursor:pointer;opacity:.32;transition:.12s;padding:0}
.cal-cell:hover .cal-add{opacity:1}
.cal-add:hover{border-color:var(--jade);color:var(--jade);background:var(--jade-soft)}
.cal-ev.lead{background:#F7E2DF;color:#B03328}

/* ---------- Sales / Leads ---------- */
.kpi.clk{cursor:pointer;transition:.13s}
.kpi.clk:hover{border-color:var(--jade);box-shadow:0 4px 14px rgba(28,124,108,.13)}
.lead-strip{display:flex;flex-wrap:wrap;gap:8px}
.lstat{display:flex;align-items:center;gap:7px;background:var(--canvas);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12px;color:var(--muted);font-weight:550;cursor:pointer;transition:.12s;position:relative;flex:1 1 150px;min-width:140px}
.lstat:hover{border-color:var(--jade);background:#fff}
.lstat.on{border-color:var(--jade);background:var(--jade-soft);color:var(--jade-d)}
.lstat br{line-height:1.6}
.lstat b{font-family:var(--mono);color:var(--text);font-size:13px}
.lstat .cdot{width:9px;height:9px;border-radius:50%;flex:none}
.lstat .lbar{position:absolute;left:0;right:0;bottom:0;height:2px;background:transparent;border-radius:0 0 9px 9px;overflow:hidden}
.lstat .lbar i{display:block;height:100%}
.callbtns{display:flex;flex-wrap:wrap;gap:7px}
.cob{background:var(--canvas);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:550;color:var(--text);cursor:pointer;transition:.12s}
.cob:hover{border-color:var(--jade);background:var(--jade-soft);color:var(--jade-d)}
.lnotes{width:100%;min-height:80px;font-size:13px}
.btn.pri svg{color:#fff}

/* ---------- Finances ---------- */
.bal-hero{background:linear-gradient(155deg,var(--ink),var(--ink2));border-radius:var(--radius);padding:24px 26px;color:#fff;display:flex;gap:40px;flex-wrap:wrap;align-items:center;box-shadow:var(--shadow)}
.bal-hero .big{font-family:var(--disp);font-size:38px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.bal-hero .lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8FA0B5;margin-bottom:8px}
.bal-hero .split{display:flex;gap:34px}
.bal-hero .split .v{font-family:var(--mono);font-size:19px;font-weight:600}
.bal-hero .in{color:#5FD3B4}.bal-hero .out{color:#F1A79C}
.ledger td .amt{font-family:var(--mono);font-weight:600}
.amt.in{color:var(--jade)}.amt.out{color:var(--danger)}

/* reports */
.bars{display:flex;flex-direction:column;gap:9px}
.brow{display:grid;grid-template-columns:130px 1fr 90px;gap:12px;align-items:center;font-size:12.5px}
.brow .bl{font-weight:550;color:var(--text)}
.btrack{height:20px;background:var(--line2);border-radius:5px;overflow:hidden}
.btrack i{display:block;height:100%;background:var(--jade);border-radius:5px}
.brow .bv{font-family:var(--mono);font-weight:600;text-align:right;font-size:12px}
.rmonth{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.rmc{background:var(--surface2);border:1px solid var(--line2);border-radius:9px;padding:9px;text-align:center}
.rmc .m{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rmc .c{font-family:var(--disp);font-size:20px;font-weight:600;margin-top:2px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);z-index:200;opacity:0;transition:.25s;display:flex;align-items:center;gap:9px}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:16px;height:16px;color:#5FD3B4}
.linkbtn{color:var(--jade);font-weight:600;cursor:pointer}

/* ---------- Photos / identification ---------- */
.savatar{width:52px;height:52px;border-radius:13px;background:var(--jade-soft);color:var(--jade-d);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none;cursor:pointer;overflow:hidden;border:1px solid var(--line);font-family:var(--disp)}
.savatar img{width:100%;height:100%;object-fit:cover}
.savatar.sm{width:34px;height:34px;border-radius:9px;font-size:12px;cursor:default}
.savatar.sm img{width:100%;height:100%;object-fit:cover}
.idgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.idcard{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px}
.idlabel{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:7px;letter-spacing:.02em}
.idbox{height:118px;border:1.5px dashed var(--line);border-radius:9px;display:grid;place-items:center;cursor:pointer;overflow:hidden;background:var(--surface2);transition:.13s}
.idbox:hover{border-color:var(--jade);background:var(--jade-soft)}
.idbox img{width:100%;height:100%;object-fit:cover}
.idempty{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--faint);font-size:11.5px;font-weight:500}
.idempty svg{width:22px;height:22px}
.idacts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.idacts:empty{display:none}
.lightbox{position:fixed;inset:0;background:rgba(15,27,45,.86);z-index:300;display:none;place-items:center;padding:30px;cursor:zoom-out}
.lightbox.on{display:grid}
.lightbox img{max-width:96vw;max-height:92vh;border-radius:10px;box-shadow:var(--shadow-lg)}

/* ---------- Multi-select picker ---------- */
.pick{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.pick-top{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--line2);background:var(--surface2)}
.pick-top input{flex:1;border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:13px}
.pick-count{font-size:11.5px;font-weight:600;color:var(--jade-d);white-space:nowrap;padding-right:4px}
.pick-list{max-height:210px;overflow-y:auto}
.pick-row{display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:13px}
.pick-row:hover{background:var(--surface2)}
.pick-row.on{background:var(--jade-soft)}
.pick-row input{width:16px;height:16px;flex:none;accent-color:var(--jade)}
.pick-row .pnm{flex:1}
.chipwrap{display:flex;flex-wrap:wrap;gap:6px}
.schip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:4px 11px 4px 8px;font-size:12px;font-weight:550;cursor:pointer}
.schip:hover{border-color:var(--jade);color:var(--jade-d)}

/* ---------- Document matrix ---------- */
.fileop-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.opfilters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.opfilters .filt{padding:6px 9px;font-size:12px}
.opfilters .fl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.opfilters .count{margin-left:auto;font-size:12px;font-weight:600;color:var(--jade-d);font-family:var(--mono)}
.fileop-top .field select{padding:6px 8px}
.docmatrix{max-height:min(56vh,520px);overflow:auto;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.dmt{border-collapse:collapse;width:100%;font-size:12px}
.dmt th,.dmt td{border:1px solid var(--line2);padding:0;text-align:center}
.dmt thead th,.dmt tr:first-child th{position:sticky;top:0;z-index:3;background:var(--surface2)}
.dmt .stuh{text-align:left;padding:8px 10px;white-space:nowrap;font-weight:600;position:sticky;left:0;background:var(--surface);z-index:1;min-width:150px}
.dmt thead .stuh{background:var(--surface2)}
.dmt thead .stuh,.dmt tr:first-child .stuh{position:sticky;left:0;top:0;z-index:5}
.dmt .dnh{background:var(--surface2);color:var(--muted);font-weight:700;width:30px;font-family:var(--mono)}
.dmt td.dnh.full{color:var(--jade-d);background:var(--jade-soft)}
.dmt .dcell{width:30px}
.dmt .dcell input{width:16px;height:16px;accent-color:var(--jade);cursor:pointer;margin:6px auto;display:block}
.dmt tbody tr:hover td{background:var(--surface2)}
.dmt tbody tr:hover .stuh{background:var(--surface2)}
.doclegend{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;margin-top:12px;font-size:11px;color:var(--muted)}
.doclegend b{display:inline-block;width:18px;color:var(--jade-d);font-family:var(--mono)}
.modal.wide{width:1080px}
.email-prev{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:12px 14px;font-family:var(--mono);font-size:11.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow-y:auto;color:var(--text);margin:0}

/* payment / visa matrix inputs */
.paytable td{padding:5px 7px}
.paytable .cin{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:12px;background:var(--surface);min-width:74px}
.paytable input.cin[type=text],.paytable input.cin{min-width:90px}
.owe{color:var(--danger);font-size:11px;font-weight:700}
.dmt td.dcell input{width:16px;height:16px;accent-color:var(--jade);cursor:pointer;margin:6px auto;display:block}

/* student email recipients */
.se-out{display:flex;flex-direction:column;gap:6px;max-height:230px;overflow-y:auto}
.se-row{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface)}
.se-nm{flex:1;font-size:13px;font-weight:550}
.se-acts{display:flex;gap:6px}

/* student bulk select */
.bulkbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line2);background:var(--jade-soft)}
.bulkn{font-weight:700;font-size:13px;color:var(--jade-d)}
.bulkgroup{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.bulkgroup select{padding:5px 8px}
.ckh,.ckcell{width:34px;text-align:center}
.ckcell input,.ckh input{width:16px;height:16px;accent-color:var(--jade);cursor:pointer}
tr.rowsel td{background:var(--jade-soft)!important}

/* login screen */
.login-screen{position:fixed;inset:0;z-index:400;background:linear-gradient(160deg,var(--ink),var(--ink2));display:flex;align-items:center;justify-content:center;padding:24px}
.login-screen.hide{display:none}
.login-card{background:var(--surface);border-radius:16px;padding:32px 30px;width:340px;max-width:92vw;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.login-brand{font-family:var(--disp);font-weight:700;font-size:26px;color:var(--ink);letter-spacing:-.02em}
.login-brand span{color:var(--jade)}
.login-sub{color:var(--muted);font-size:13px;margin:2px 0 20px}
.login-l{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:12px 0 5px}
.login-in{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-size:14px;background:var(--surface2)}
.login-in:focus{border-color:var(--jade);outline:none}
.login-err{color:var(--danger);font-size:12.5px;font-weight:600;min-height:18px;margin-top:8px}
.login-btn{width:100%;background:var(--jade);color:#fff;border:none;border-radius:9px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px}
.profile-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:6px}
.profile-btn{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--line);border-radius:11px;background:var(--surface2);cursor:pointer;font-size:15px;font-weight:600;color:var(--ink);transition:.12s}
.profile-btn:hover{border-color:var(--jade);background:var(--jade-soft)}
.profile-btn .pav{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700;flex:none}
.who-chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:5px 12px 5px 8px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;margin-right:8px}
.who-chip:hover{border-color:var(--jade)}
.who-dot{width:22px;height:22px;border-radius:50%;background:var(--jade);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.field.req-empty input,.field.req-empty select,.field.req-empty textarea{border-color:var(--danger)!important;background:#FCEEEC}
.req-flag{color:var(--danger);font-size:11px;font-weight:600;margin-left:6px}
.listchips{display:flex;flex-wrap:wrap;gap:6px}
.lchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:4px 6px 4px 11px;font-size:12.5px;color:var(--ink)}
.lchip button{border:none;background:var(--line2);color:var(--muted);width:18px;height:18px;border-radius:50%;cursor:pointer;font-size:13px;line-height:1;display:grid;place-items:center}
.lchip button:hover{background:var(--danger);color:#fff}
.office-box{background:linear-gradient(180deg,#F3F7F5,#EDF3F0);border:1px solid var(--jade-soft);border-radius:14px;padding:14px 16px}
.office-box .ob-h{font-weight:650;color:var(--ink);display:flex;align-items:center;gap:8px;margin-bottom:12px}
.office-box .ob-h svg{width:17px;height:17px}
.ob-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ob-cell{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.ob-cell.accent{background:var(--jade-soft);border-color:var(--jade)}
.ob-cell .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.ob-cell .v{font-size:20px;font-weight:700;font-family:var(--mono);margin:3px 0 2px}
.ob-cell .v.in{color:var(--jade-d)}.ob-cell .v.out{color:var(--danger)}
@media(max-width:680px){.ob-grid{grid-template-columns:1fr}}
.login-btn:hover{background:var(--jade-d)}
@media(max-width:560px){ .idgrid{grid-template-columns:1fr} .doclegend{grid-template-columns:1fr} }
.mted{display:none}

@media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}.kan{grid-template-columns:1fr}}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:236px;z-index:120;transform:translateX(-100%);transition:.25s;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .side.on{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .side-close{display:grid!important}
  .mted{display:inline-flex}
  .search{width:auto;flex:1}
  .view{padding:18px 16px 60px}
  .topbar{padding:12px 16px}
  .frow2,.frow3{grid-template-columns:1fr}
  .calgrid .cal-cell{min-height:74px}
  .modal{max-height:92vh;width:100%}
  .modal.wide{width:100%}
  .modal-h{padding:14px 16px}
  .modal-b{padding:16px}
  .modal-f{padding:12px 16px}
  .modal-f .btn{flex:1 1 auto;justify-content:center}
  .toolbar{gap:8px}
  .bulkbar{padding:10px}
}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo">DZ</div>
      <div><b>DZB Hub</b><span>China Study Ops</span></div>
      <button class="side-close" id="side-close" title="Close menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <nav class="nav" id="nav">
      <div class="grp">Overview</div>
      <a data-view="dashboard" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> Dashboard</a>
      <div class="grp">Sales</div>
      <a data-view="sales"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l4 4V6L6 10H4a1 1 0 0 0-1 1Z"/><path d="M14 8a4 4 0 0 1 0 8"/><path d="M17 5a8 8 0 0 1 0 14"/></svg> Leads <span class="badge" id="nb-leads">0</span></a>
      <div class="grp">Pipeline</div>
      <a data-view="students"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Students <span class="badge" id="nb-students">0</span></a>
      <a data-view="operations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg> Operations <span class="badge" id="nb-ops">0</span></a>
      <a data-view="visa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="10" r="2.5"/><path d="M8 17c.8-1.8 2.3-3 4-3s3.2 1.2 4 3"/></svg> Visa <span class="badge" id="nb-visa">0</span></a>
      <div class="grp">Work</div>
      <a data-view="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> Tasks <span class="badge" id="nb-tasks">0</span></a>
      <a data-view="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Calendar</a>
      <div class="grp">Money</div>
      <a data-view="finances"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5"/><path d="M18 12a1 1 0 0 0 0 2h2v-2Z"/></svg> Finances</a>
      <a data-view="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="7"/><rect x="12" y="7" width="3" height="11"/><rect x="17" y="13" width="3" height="5"/></svg> Reports</a>
    </nav>
    <div class="side-foot">
      <div class="sync-badge off" id="sync-badge">Local only</div>
      <button id="btn-sync"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/></svg> Cloud sync</button>
      <button id="btn-export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg> Backup data</button>
      <button id="btn-import"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/></svg> Restore backup</button>
      <button id="btn-logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg> Lock / sign out</button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <button class="btn ghost sm mted" id="menu-btn" style="padding:6px 8px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
      <div class="ttl"><h1 id="page-title">Dashboard</h1><p id="page-sub">Everything at a glance</p></div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="global-search" placeholder="Search students, tasks…" autocomplete="off"/>
        <div class="drop" id="search-drop"></div>
      </div>
      <button class="who-chip" id="who-chip" title="Switch profile"><span class="who-dot"></span><span id="who-name">—</span></button>
      <button class="btn pri" id="quick-add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> New</button>
    </div>
    <div id="views"></div>
  </div>
</div>

<!-- overlays -->
<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer"><div class="drawer-h" id="drawer-h"></div><div class="drawer-b" id="drawer-b"></div></div>
<div class="modal" id="modal"><div id="modal-inner"></div></div>
<div class="toast" id="toast"></div>
<div class="login-screen" id="login">
  <div class="login-card">
    <div class="login-brand">DZB<span>Hub</span></div>
    <p class="login-sub">Agency access — please sign in</p>
    <label class="login-l">Access ID</label>
    <input id="lg-id" class="login-in" autocomplete="off" placeholder="ID"/>
    <label class="login-l">Password</label>
    <input id="lg-pw" class="login-in" type="password" placeholder="Password"/>
    <div class="login-err" id="lg-err"></div>
    <button class="login-btn" id="lg-go">Sign in</button>
  </div>
</div>
<div class="login-screen hide" id="profile-screen">
  <div class="login-card">
    <div class="login-brand">Who's using DZB<span>Hub?</span></div>
    <p class="login-sub">Pick your profile so tasks are traceable</p>
    <div class="profile-grid" id="profile-grid"></div>
  </div>
</div>
<input type="file" id="file-in" accept="application/json" style="display:none"/>
<input type="file" id="csv-in" accept=".csv,.tsv,text/csv,text/plain" style="display:none"/>

function migrate(st){
  if(SEED._build) st._build=SEED._build;
  ['students','operations','tasks','fees','expenses','leads','appointments'].forEach(k=>{ if(!Array.isArray(st[k])) st[k]=[]; });
  if(!st.team) st.team=SEED.team||[];
  st.tasks.forEach(t=>{ if(!t.studentRefs) t.studentRefs = t.studentRef?[t.studentRef]:[]; });
  // give older payments/expenses a payment method, derived from their free-text place
  st.fees.forEach(f=>{ if(f.method===undefined) f.method=methodFromText(f.place); });
  st.expenses.forEach(e=>{ if(e.method===undefined) e.method=methodFromText(e.purpose); });
  if(!st.emailDefaults) st.emailDefaults={...EMAIL_DEFAULTS_SEED};
  if(!st.emailTemplates) st.emailTemplates=TEMPLATES_SEED.map(t=>({...t}));
  if(!st.lists) st.lists={};
  if(!Array.isArray(st.visa)) st.visa=[];
  // one-time: absorb existing visa operations into the dedicated visa sheet
  if(!st._visaMigrated){
    (st.operations||[]).forEach(o=>{
      if(o.opType==='visa' && o.students && o.students.length){
        o.students.forEach(rs=>{
          if(st.visa.some(v=>v.ref===rs.ref)) return;
          st.visa.push({
            id:++st._uid, ref:rs.ref, name:rs.name||'', program:rs.program||'',
            type:'adult', docs:{}, stage:rs.visaStage||'Requesting documents',
            deadline:o.deadline||null, university:rs.university||'', pickup:false,
            notes:'', createdAt:o.opDate||today(), fromOp:o.id
          });
        });
        o.archived=true; o._movedToVisa=true;   // hide from operations, keep the record
      }
    });
    st._visaMigrated=true;
  }
  // Backfill the sales leads for anyone who saved data before the Sales module existed
  if(!st._leadsSeeded && (!st.leads || !st.leads.length)){
    st._leadsSeeded=true;
    (SEED.leads||[]).forEach(l=>st.leads.push({...l,id:++st._uid}));
  }
  mergeLeadsBatch(st, SEED.leadsPCL, '_pclSeeded');
  return st;
}
function mergeLeadsBatch(st, batch, flag){
  if(st[flag]) return 0;
  st[flag]=true;
  const have=new Set(st.leads.map(l=>(l.name||'').toLowerCase()+'|'+(l.wa||'')));
  let n=0;
  (batch||[]).forEach(l=>{ const k=(l.name||'').toLowerCase()+'|'+(l.wa||''); if(have.has(k))return; have.add(k); st.leads.push({...l,id:++st._uid,receivedAt:l.receivedAt||today()}); n++; });
  return n;
}
function seedState(){

  SEED.fees.forEach(f=>{ const s=findS(f.studentId,f.studentName); st.fees.push({...f,id:++st._uid,studentRef:s?s.id:null,date:f.date||'',method:f.method!==undefined?f.method:methodFromText(f.place)}); });

function parseLoose(d){
  if(!d) return null; let dt=new Date(d); if(!isNaN(dt)&&/\d{4}-\d{2}-\d{2}/.test(String(d))) return dt;
  const s=String(d).toUpperCase().replace(/(\d)(ST|ND|RD|TH)/g,'$1');
  dt=new Date(s); if(!isNaN(dt)) return dt;
  const m=s.match(/([A-Z]+)\s*(\d{1,2}),?\s*(\d{4})/); if(m){ const mi=MONTHS.findIndex(x=>x.toUpperCase()===m[1].slice(0,3)); if(mi>=0) return new Date(+m[3],mi,+m[2]); }
  return null;
}
function daysUntil(d){ const dt=parseLoose(d); if(!dt) return null; return Math.ceil((dt-new Date().setHours(0,0,0,0))/864e5); }
function ym(d){ const dt=parseLoose(d); return dt?dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'):null; }

function statusChip(s){ const c=SC[s]||'#888'; return `<span class="chip" style="background:${c}18;color:${c}"><span class="cdot" style="background:${c}"></span>${esc(s)}</span>`; }
function studentById(id){ return S.students.find(s=>s.id===id); }

  if(studentFilter.type) rows=rows.filter(s=>s.contractType===studentFilter.type);
  if(studentFilter.intake) rows=rows.filter(s=>(s.intake||'')===studentFilter.intake);
  if(studentFilter.csca) rows=rows.filter(s=>(s.csca||'')===studentFilter.csca);
  if(studentFilter.sort==='name') rows.sort((a,b)=>a.name.localeCompare(b.name));
  else if(studentFilter.sort==='deadline') rows.sort((a,b)=>{const x=daysUntil(a.filesDeadline),y=daysUntil(b.filesDeadline);return (x==null?1e9:x)-(y==null?1e9:y);});

        <td class="sub">${esc(s.intake||'—')}</td>
        <td>${s.csca==='yes'?'<span class="chip" style="background:var(--jade-soft);color:var(--jade-d)">✓ yes</span>':s.csca==='no'?'<span class="pill">no</span>':'<span class="sub">—</span>'}</td>

        <td>${s.drive?`<a class="btn ghost sm" href="${esc(s.drive)}" target="_blank" onclick="event.stopPropagation()" title="Open Drive files">${I.file}</a>`:''}</td>
      </tr>`;}).join('')||`<tr><td colspan="10"><div class="empty">${I.users}<h4>No students match</h4><p>Try clearing the filters.</p></div></td></tr>`}</tbody>`;
  rows.filter(s=>s.hasPhoto).forEach(s=>idbGet('photo:'+s.id).then(d=>{ const c=el('srow-'+s.id); if(c&&d) c.innerHTML=`<img src="${d}"/>`; }).catch(()=>{}));
  renderBulkBar();
}

function toggleAllStu(on){ let rows=S.students.slice(); const q=studentFilter.q.toLowerCase(); if(studentFilter.intake)rows=rows.filter(s=>(s.intake||'')===studentFilter.intake); if(studentFilter.csca)rows=rows.filter(s=>(s.csca||'')===studentFilter.csca);
  if(q) rows=rows.filter(s=>(s.name+' '+s.major+' '+s.email+' '+s.phone).toLowerCase().includes(q));
  if(studentFilter.status) rows=rows.filter(s=>s.status===studentFilter.status);
  if(studentFilter.type) rows=rows.filter(s=>s.contractType===studentFilter.type);
  rows.forEach(s=>{ if(on)stuSel.add(s.id); else stuSel.delete(s.id); }); renderStudentRows(); }

function openImport(){

    <div id="import-preview" class="sub" style="margin-top:10px"></div>
  </div>
  <div class="modal-f"><button class="btn" onclick="closeOverlays()">Cancel</button><button class="btn pri" onclick="runImport()">Import</button></div>`);

function runImport(){
  const txt=el('csv-paste').value.trim();
  if(!txt){ toast('Paste rows or choose a file first',1); return; }
  const res=importFromText(txt);
  el('import-preview').innerHTML=`<b style="color:var(--jade-d)">${res.added} added</b> · ${res.dupes} duplicates skipped · ${res.blank} blank rows`;
}
function importFromText(txt){
  const table=parseDelimited(txt);
  if(!table.length) return {added:0,dupes:0,blank:0};
  const header=table[0].map(h=>String(h||'').trim());
  const idx=mapColumns(header);
  const existing=new Set(S.leads.map(l=>(l.name||'').toLowerCase()+'|'+(l.wa||'')));
  let added=0,dupes=0,blank=0;
  for(let i=1;i<table.length;i++){
    const r=table[i]; if(!r||!r.some(c=>String(c||'').trim())){blank++;continue;}
    const get=(k)=>idx[k]>=0?r[idx[k]]:'';
    const name=String(get('name')||'').trim();
    const wa=normPhone(get('wa'));
    if(!name&&!wa){blank++;continue;}
    const key=(name||'(no name)').toLowerCase()+'|'+wa;
    if(existing.has(key)){dupes++;continue;}
    existing.add(key);
    let ra=String(get('ts')||'').trim(); const dt=parseLoose(ra); ra=dt?dt.toISOString().slice(0,10):today();
    S.leads.push({id:nid(),name:name||'(no name)',wa,city:String(get('city')||'').trim(),
      age:arMap('age',get('age')),program:arMap('program',get('program')),startWhen:arMap('start',get('start')),
      degree:arMap('degree',get('degree')),gpa:String(get('gpa')||'').replace(',','.').trim(),major:String(get('major')||'').trim(),
      tests:arMap('tests',get('tests')),funding:arMap('fund',get('fund')),otherAgency:arMap('agency',get('agency')),
      why:String(get('why')||'').trim(),receivedAt:ra,status:'New',assignee:'',notes:'',nextFollowUp:'',calls:[],studentRef:null,convertedAt:null});
    added++;
  }
  if(added){ save(); refreshBadges(); if(CUR==='sales')RENDER.sales(); }
  toast(added+' leads imported'+(dupes?' · '+dupes+' skipped':''));
  return {added,dupes,blank};
}
function mapColumns(header){
  // returns index for each logical field, matching Arabic form headers or common English fallbacks
  const find=(subs)=>header.findIndex(h=>{const t=h.toLowerCase();return subs.some(s=>t.includes(s.toLowerCase()));});
  return {
    ts:find(['timestamp','طابع','التاريخ','date']),
    name:find(['الإسم','الاسم','full name','name','nom']),
    age:find(['السن','age','عمر']),
    city:find(['مدينة','city','ville','الإقامة']),
    wa:find(['واتساب','whatsapp','phone','tel','هاتف','رقم']),
    program:find(['البرنامج','program','برنامج']),
    start:find(['متى','start','البدء']),
    degree:find(['أعلى شهادة','شهادة حصلت','degree','diploma']),
    gpa:find(['المعدل','gpa','معدل']),
    major:find(['التخصص','major','special']),
    tests:find(['الاختبارات','اختبار','test','ielts']),
    fund:find(['بمفردك','عائلت','fund','family','support']),
    agency:find(['وكالات','agenc','وكالة']),
    why:find(['لماذا','why','raison'])
  };
}
function parseDelimited(txt){
  // auto-detect delimiter: tab if present in first line else comma
  const firstLine=txt.slice(0,txt.indexOf('\n')<0?txt.length:txt.indexOf('\n'));
  const delim=firstLine.indexOf('\t')>=0?'\t':',';
  const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){ const ch=txt[i];
    if(q){ if(ch==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else { if(ch==='"')q=true; else if(ch===delim){row.push(cur);cur='';}
      else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else if(ch==='\r'){} else cur+=ch; } }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.length>1||String(r[0]||'').trim());
}

let opView='active', opSel=new Set();
function toggleOpSel(id,on){ if(on)opSel.add(id); else opSel.delete(id); const r=event&&event.target?event.target.closest('tr'):null; if(r)r.classList.toggle('rowsel',on); renderOpBulk(); }
function toggleAllOps(on){ let rows=S.operations.filter(o=>opView==='archived'?o.archived:!o.archived); if(opFilter.type)rows=rows.filter(o=>o.opType===opFilter.type); if(opFilter.status)rows=rows.filter(o=>o.status===opFilter.status); rows.forEach(o=>{ if(on)opSel.add(o.id); else opSel.delete(o.id); }); renderOps(); }
function clearOpSel(){ opSel=new Set(); const b=el('op-bulk'); if(b){b.style.display='none';b.innerHTML='';} }
function renderOpBulk(){
  const bar=el('op-bulk'); if(!bar)return;
  if(!opSel.size){ bar.style.display='none'; bar.innerHTML=''; return; }
  bar.style.display='flex';
  bar.innerHTML=`<span class="bulkn">${opSel.size} selected</span>`+(opView==='archived'
    ? `<button class="btn sm" onclick="opBulk('restore')">${I.arrow} Restore to active</button><button class="btn sm dng" onclick="opBulk('delete')">${I.trash} Delete permanently</button>`
    : `<button class="btn sm" onclick="opBulk('archive')">${I.layers} Archive selected</button>`)
    +`<button class="btn ghost sm" style="margin-left:auto" onclick="clearOpSel();renderOps()">Clear</button>`;
}
function opBulk(action){
  const ids=[...opSel]; const n=ids.length;
  if(action==='delete'){ if(!confirm('Permanently delete '+n+' archived operation'+(n===1?'':'s')+'? This cannot be undone.'))return; S.operations=S.operations.filter(o=>!opSel.has(o.id)); toast(n+' deleted'); }
  else if(action==='archive'){ ids.forEach(id=>{const o=S.operations.find(x=>x.id===id); if(o){o.archived=true;o.archivedAt=today();}}); toast(n+' archived'); }
  else if(action==='restore'){ ids.forEach(id=>{const o=S.operations.find(x=>x.id===id); if(o){o.archived=false;delete o.archivedAt;}}); toast(n+' restored'); }
  save(); clearOpSel(); renderOps(); refreshBadges();
}

let fileFilter={mode:'',doc:''}, fileFilterOp=null;
function fileFilterSet(id){ fileFilter={mode:el('ff-mode').value,doc:el('ff-doc').value}; openFileOp(id); }
function fileEntries(o){
  return (o.students||[]).map((st,si)=>({st,si})).filter(({st})=>{
    const docs=st.docs||[], cnt=docs.filter(Boolean).length;
    if(fileFilter.mode==='complete' && cnt<FILE_DOCS.length) return false;
    if(fileFilter.mode==='incomplete' && cnt>=FILE_DOCS.length) return false;
    if(fileFilter.doc!=='' && docs[+fileFilter.doc]) return false;   // still missing this document
    return true;
  });
}

    <div class="opfilters">

      <select id="ff-mode" class="filt" onchange="fileFilterSet(${id})"><option value="">All students</option><option value="complete" ${fileFilter.mode==='complete'?'selected':''}>Complete (13/13)</option><option value="incomplete" ${fileFilter.mode==='incomplete'?'selected':''}>Incomplete</option></select>

let visaView='list', visaVF={stage:'',uni:'',due:''}, visaPickSel=new Set();
function visaUniversities(){ const set=[]; S.visa.forEach(v=>{ const u=v.university||'(no university)'; if(set.indexOf(u)<0)set.push(u); }); return set.sort(); }
function visaDueMatch(v){
  if(!visaVF.due) return true;
  const du=v.deadline?daysUntil(v.deadline):null;
  if(du==null) return visaVF.due==='none';
  if(visaVF.due==='overdue') return du<0;
  if(visaVF.due==='week') return du>=0&&du<=7;
  if(visaVF.due==='month') return du>=0&&du<=31;
  if(visaVF.due==='none') return false;
  return true;
}
function visaFiltered(){
  return S.visa.filter(v=>{
    if(visaVF.stage && v.stage!==visaVF.stage) return false;
    if(visaVF.uni && (v.university||'(no university)')!==visaVF.uni) return false;
    if(!visaDueMatch(v)) return false;
    return true;
  });
}

/* ============ TASKS ============ */
let taskView='board';
let taskFilter={time:'',who:''};
function taskInTime(t){
  if(!taskFilter.time) return true;
  const ref=t.lastUpdate||t.createdAt||t.deadline; if(!ref) return taskFilter.time?false:true;
  const d=(''+ref).slice(0,10); const now=new Date(); 
  if(taskFilter.time==='week'){ const wk=new Date(now); wk.setDate(now.getDate()-7); return d>=wk.toISOString().slice(0,10); }
  if(taskFilter.time==='month'){ return d.slice(0,7)===now.toISOString().slice(0,7); }
  if(taskFilter.time==='open'){ return t.status!=='Done'; }
  return true;
}
function taskMatches(t){
  if(taskFilter.who==='__me'){ if(t.assignee!==ME) return false; }
  else if(taskFilter.who){ if(t.assignee!==taskFilter.who) return false; }
  return taskInTime(t);
}
function tasksFiltered(){ return S.tasks.filter(taskMatches); }

      <div class="seg"><button class="${taskView==='board'?'on':''}" onclick="taskView='board';RENDER.tasks()">Board</button><button class="${taskView==='list'?'on':''}" onclick="taskView='list';RENDER.tasks()">List</button></div>
      <select id="tf-time" class="filt" onchange="taskFilter.time=this.value;RENDER.tasks()"><option value="" ${taskFilter.time===''?'selected':''}>All time</option><option value="open" ${taskFilter.time==='open'?'selected':''}>Open only</option><option value="week" ${taskFilter.time==='week'?'selected':''}>This week</option><option value="month" ${taskFilter.time==='month'?'selected':''}>This month</option></select>

function delTask(id){ if(!confirm('Delete this task?'))return; const t=S.tasks.find(x=>x.id===id); if(t&&t.opId){ /* keep the operation but unlink */ const o=S.operations.find(o=>o.id===t.opId); if(o)o.taskId=null; } S.tasks=S.tasks.filter(t=>t.id!==id); save(); closeOverlays(); RENDER.tasks(); refreshBadges(); toast('Task deleted'); }

/* ---- task ⇄ operation linkage ---- */
function opTypeForTask(t){ return TASK_OP_MAP[t.type]||'informed'; }
function rosterEntry(ref){ const s=studentById(ref); return {ref,name:s?s.name:'',program:s?s.contractType:'',docs:newDocs(),university:'',uniFees:'',agencyFees:'',paidUni:false,paidAgency:false,payStatus:'Sent',payMethod:'',visaStage:'Requesting documents'}; }
function buildRoster(t){ return taskStudentRefs(t).map(ref=>rosterEntry(ref)); }
const ROSTER_TYPES=['file order','payment order','visa'];
function syncTaskOp(t,opStatus){
  let op = t.opId ? S.operations.find(o=>o.id===t.opId) : null;
  const otype=opTypeForTask(t), refs=taskStudentRefs(t);
  let created=false;
  if(!op){
    created=true;
    op={id:nid(),taskId:t.id,opType:otype,member:t.assignee||'',opDate:today(),deadline:t.deadline||null,status:opStatus,amount:'',notes:t.title,title:t.title||''};
    if(ROSTER_TYPES.includes(otype)||refs.length>1){ op.students=buildRoster(t); op.studentName=refs.length+' student'+(refs.length===1?'':'s'); }
    else if(refs.length===1){ const s=studentById(refs[0]); op.studentRef=s?s.id:null; op.studentId=s?s.sid:null; op.studentName=s?s.name:(t.contact||''); }
    else op.studentName=t.contact||'';
    S.operations.push(op); t.opId=op.id;
  } else {
    op.status=opStatus; op.opType=otype; op.deadline=t.deadline||op.deadline; op.notes=op.notes||t.title;
    if(ROSTER_TYPES.includes(otype)||refs.length>1){
      if(!op.students)op.students=[];
      const have=new Set(op.students.map(x=>x.ref));
      refs.forEach(ref=>{ if(!have.has(ref)) op.students.push(rosterEntry(ref)); });
      op.students=op.students.filter(x=>refs.includes(x.ref));
      op.studentName=refs.length+' student'+(refs.length===1?'':'s');
    }
  }
  return {op,created};
}
function onTaskStatus(t){
  if(t.status==='In Progress'){ const r=syncTaskOp(t,'in progress'); if(r.created) toast('Operation created from task'); }
  else if(t.status==='Done'){ syncTaskOp(t,'done'); }
  else if(t.status==='To Do'){ if(t.opId){ const o=S.operations.find(o=>o.id===t.opId); if(o)o.status='initiated'; } }
}
function taskToOp(id){
  const t=S.tasks.find(x=>x.id===id);
  const r=syncTaskOp(t, t.status==='Done'?'done':'in progress'); save(); refreshBadges();
  toast(r.created?'Operation created':'Operation updated');
  if(r.op.students) openBatchOp(r.op.id); else { closeOverlays(); go('operations'); }
}

function calEvents(){

  const ev=calEvents(); const first=new Date(calY,calM,1); const start=(first.getDay()+6)%7; const dim=new Date(calY,calM+1,0).getDate();

function monthName(m){ if(m==='all')return 'All time'; if(m==='none')return 'Undated'; const [y,mo]=m.split('-'); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+mo-1]+' '+y; }
function monthsPresent(){
  const set=new Set();
  S.fees.forEach(f=>{ if(f.date)set.add((''+f.date).slice(0,7)); });
  S.expenses.forEach(e=>{ if(e.date)set.add((''+e.date).slice(0,7)); });
  const now=new Date(); const cur=now.toISOString().slice(0,7);
  const nx=new Date(now.getFullYear(),now.getMonth()+1,1).toISOString().slice(0,7);
  set.add(cur); set.add(nx);
  return [...set].sort().reverse();
}
function inFinMonth(d){ if(finMonth==='all')return true; if(finMonth==='none')return !d; return (''+ (d||'')).slice(0,7)===finMonth; }
function setFinMonth(v){ finMonth=v; RENDER.finances(); }
function shiftFinMonth(dir){
  const list=['all',...monthsPresent(),'none'];
  let i=list.indexOf(finMonth); if(i<0)i=0;
  i=Math.min(list.length-1,Math.max(0,i+dir)); finMonth=list[i]; RENDER.finances();
}

  S.expenses.forEach(e=>{ if(!inFinMonth(e.date))return; const m=e.method||''; (t[m]=t[m]||{in:0,out:0}).out+=e.amount||0; });

}

  const churn=S.students.filter(s=>s.status==='CHERNED').length;
  const active=total-churn;
  const decided=placed+churn;
  const byStatus=STATUSES.map(st=>({l:st,n:S.students.filter(s=>s.status===st).length,c:SC[st]}));
  const byType=CONTRACT_TYPES.map(t=>({l:t,n:S.students.filter(s=>s.contractType===t).length})).filter(x=>x.n);
  const majors={}; S.students.forEach(s=>{const m=(s.major||'—').toUpperCase().split(/[\/\\(]/) [0].trim()||'Not set';majors[m]=(majors[m]||0)+1;});
  const topMaj=Object.entries(majors).filter(([k])=>k&&k!=='—'&&k!=='NOT SET').sort((a,b)=>b[1]-a[1]).slice(0,6);
  const mk=monthKeys(S.students.map(s=>s.contractSigned));
  const perMonth=mk.map(m=>({m,n:S.students.filter(s=>(s.contractSigned||'').slice(0,7)===m).length}));
  const mxm=Math.max(...byStatus.map(x=>x.n),1);
  el('rep-body').innerHTML=`
    <div class="grid kpis" style="margin-bottom:16px">
      <div class="kpi"><div class="lab">Total signed</div><div class="val">${total}</div></div>
      <div class="kpi"><div class="lab">Placed (admitted/in China)</div><div class="val">${placed}</div><div class="sub up">${pct(placed,total)}% of all</div></div>
      <div class="kpi"><div class="lab">Closing rate</div><div class="val">${pct(placed,decided)}%</div><div class="sub">of ${decided} decided (placed vs churned)</div></div>
      <div class="kpi"><div class="lab">Churned</div><div class="val">${churn}</div><div class="sub dn">${pct(churn,total)}% lost</div></div>
    </div>
    <div class="grid" style="grid-template-columns:1fr 1fr;align-items:start">
      <div class="panel"><div class="panel-h"><h3>By status</h3></div><div class="panel-b"><div class="bars">
        ${byStatus.map(x=>`<div class="brow"><div class="bl">${esc(x.l)}</div><div class="btrack"><i style="width:${x.n/mxm*100}%;background:${x.c}"></i></div><div class="bv">${x.n}</div></div>`).join('')}
      </div></div></div>
      <div class="panel"><div class="panel-h"><h3>By program</h3></div><div class="panel-b"><div class="bars">
        ${byType.map(x=>`<div class="brow"><div class="bl">${esc(x.l)}</div><div class="btrack"><i style="width:${x.n/Math.max(...byType.map(t=>t.n))*100}%"></i></div><div class="bv">${x.n}</div></div>`).join('')}
      </div></div></div>
    </div>
    <div class="panel" style="margin-top:16px"><div class="panel-h"><h3>New signings per month</h3></div><div class="panel-b">
      <div class="rmonth">${perMonth.map(p=>`<div class="rmc"><div class="m">${MONTHS[+p.m.slice(5,7)-1]} '${p.m.slice(2,4)}</div><div class="c">${p.n}</div></div>`).join('')}</div>
    </div></div>
    <div class="panel" style="margin-top:16px"><div class="panel-h"><h3>Most-requested majors</h3></div><div class="panel-b"><div class="bars">
      ${topMaj.map(([m,n])=>`<div class="brow"><div class="bl">${esc(m).slice(0,22)}</div><div class="btrack"><i style="width:${n/topMaj[0][1]*100}%;background:var(--gold)"></i></div><div class="bv">${n}</div></div>`).join('')}
    </div></div></div>`;
}
function repFinance(){
  const totalIn=S.fees.reduce((a,f)=>a+f.total,0), totalOut=S.expenses.reduce((a,e)=>a+e.amount,0);
  const byExp={}; S.expenses.forEach(e=>byExp[e.type]=(byExp[e.type]||0)+e.amount);
  const expArr=Object.entries(byExp).sort((a,b)=>b[1]-a[1]);
  const mk=monthKeys([...S.fees.map(f=>f.date),...S.expenses.map(e=>e.date)]);
  const perMonth=mk.map(m=>({m,in:S.fees.filter(f=>(f.date||'').slice(0,7)===m).reduce((a,f)=>a+f.total,0),out:S.expenses.filter(e=>(e.date||'').slice(0,7)===m).reduce((a,e)=>a+e.amount,0)}));
  const mxMonth=Math.max(...perMonth.map(p=>Math.max(p.in,p.out)),1);
  el('rep-body').innerHTML=`
    <div class="grid kpis" style="margin-bottom:16px">
      <div class="kpi"><div class="lab">Total collected</div><div class="val">${fmtDZD(totalIn)}</div><div class="sub">from ${S.fees.length} payments</div></div>
      <div class="kpi"><div class="lab">Total spent</div><div class="val">${fmtDZD(totalOut)}</div><div class="sub">across ${S.expenses.length} expenses</div></div>
      <div class="kpi accent"><div class="lab">Net profit</div><div class="val">${fmtDZD(totalIn-totalOut)}</div><div class="sub">margin ${pct(totalIn-totalOut,totalIn)}%</div></div>
      <div class="kpi"><div class="lab">Avg payment</div><div class="val">${fmtDZD(S.fees.length?totalIn/S.fees.length:0)}</div><div class="sub">per student</div></div>
    </div>
    <div class="panel"><div class="panel-h"><h3>Cash flow by month</h3><span class="sub">in vs out (DA)</span></div><div class="panel-b"><div class="bars">
      ${perMonth.map(p=>`<div class="brow" style="grid-template-columns:90px 1fr 1fr"><div class="bl">${MONTHS[+p.m.slice(5,7)-1]} '${p.m.slice(2,4)}</div>
        <div class="btrack" style="background:var(--jade-soft)"><i style="width:${p.in/mxMonth*100}%;background:var(--jade)"></i></div>
        <div class="btrack" style="background:var(--danger-soft)"><i style="width:${p.out/mxMonth*100}%;background:var(--danger)"></i></div></div>`).join('')}
      <div class="brow" style="grid-template-columns:90px 1fr 1fr;margin-top:4px"><div></div><div class="sub" style="color:var(--jade-d);font-weight:600">◼ In</div><div class="sub" style="color:var(--danger);font-weight:600">◼ Out</div></div>
    </div></div></div>
    <div class="panel" style="margin-top:16px"><div class="panel-h"><h3>Money in by payment method</h3><span class="sub">office vs ccp vs online</span></div><div class="panel-b"><div class="bars">
      ${(function(){const t=methodTotals();const tot=S.fees.reduce((a,f)=>a+(f.total||0),0);const ks=Object.keys(t).filter(k=>t[k].in);return ks.map(k=>`<div class="brow"><div class="bl">${esc(k||'Not set')}</div><div class="btrack"><i style="width:${tot?Math.round(t[k].in/tot*100):0}%;background:${METHOD_COLORS[k]||'#8A94A6'}"></i></div><div class="bv mono">${fmtDZD(t[k].in)}</div></div>`).join('')||'<div class="sub">No payments yet.</div>';})()}
    </div></div></div>
    <div class="panel" style="margin-top:16px"><div class="panel-h"><h3>Money out by payment method</h3></div><div class="panel-b"><div class="bars">
      ${(function(){const t=methodTotals();const tot=S.expenses.reduce((a,e)=>a+(e.amount||0),0);const ks=Object.keys(t).filter(k=>t[k].out);return ks.map(k=>`<div class="brow"><div class="bl">${esc(k||'Not set')}</div><div class="btrack"><i style="width:${tot?Math.round(t[k].out/tot*100):0}%;background:var(--danger)"></i></div><div class="bv mono">${fmtDZD(t[k].out)}</div></div>`).join('')||'<div class="sub">No expenses yet.</div>';})()}
    </div></div></div>
    <div class="panel" style="margin-top:16px"><div class="panel-h"><h3>Where the money goes</h3></div><div class="panel-b"><div class="bars">
      ${expArr.map(([t,v])=>`<div class="brow"><div class="bl">${esc(t)}</div><div class="btrack"><i style="width:${v/expArr[0][1]*100}%;background:var(--danger)"></i></div><div class="bv">${fmtDZD(v)}</div></div>`).join('')}
    </div></div></div>`;
}

/* ============ MODALS (forms) ============ */
function openModal(html,wide){ closeSide(); el('modal-inner').innerHTML=html; el('modal').classList.toggle('wide',!!wide); el('modal').classList.add('on'); el('scrim').classList.add('on'); }
function openDrawer(){ closeSide(); el('drawer').classList.add('on'); el('scrim').classList.add('on'); }
function closeOverlays(){ el('modal').classList.remove('on'); el('drawer').classList.remove('on'); el('side').classList.remove('on'); el('scrim').classList.remove('on'); }
function dismissAll(){ backToOp=null; closeOverlays(); }
function closeSide(){ el('side').classList.remove('on'); if(!document.querySelector('.modal.on,.drawer.on')) el('scrim').classList.remove('on'); }
function toggleSide(){ const on=el('side').classList.toggle('on'); if(on) el('scrim').classList.add('on'); else if(!document.querySelector('.modal.on,.drawer.on')) el('scrim').classList.remove('on'); }

function field(label,inner){ return `<div class="field"><label>${label}</label>${inner}</div>`; }
function sel(id,opts,val){ return `<select id="${id}">${opts.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`; }

  if(q) list=list.filter(s=>(s.name+' '+(s.major||'')+' '+(s.contractType||'')).toLowerCase().includes(q));
  list=list.slice(0,120);
  el('fe-count').textContent=feePickSel.size+' selected';
  el('fe-list').innerHTML=list.map(s=>`<label class="pick-row ${feePickSel.has(s.id)?'on':''}"><input type="checkbox" ${feePickSel.has(s.id)?'checked':''} onchange="toggleFeePick(${s.id},this.checked)"><span class="pnm">${esc(s.name)}</span><span class="pill">${esc(s.contractType||'')}</span></label>`).join('')||`<div class="sub" style="padding:10px">No students match.</div>`;
}
function toggleFeePick(id,on){ if(on)feePickSel.add(id); else feePickSel.delete(id); el('fe-count').textContent=feePickSel.size+' selected'; const row=event&&event.target?event.target.closest('.pick-row'):null; if(row)row.classList.toggle('on',on); }
function saveFee(id){
  const apk=+el('fe-apk').value||0,service=+el('fe-service').value||0,uni=+el('fe-uni').value||0,pickup=+el('fe-pickup').value||0;
  const total=apk+service+uni+pickup;
  if(!total){ toast('Enter at least one amount',1); return; }
  const base={apk,service,uni,pickup,total,date:el('fe-date').value,method:el('fe-method').value,place:el('fe-place').value.trim()};
  const refs=[...feePickSel];
  if(!el('fe-method').value){ if(!confirm('No payment method selected — save anyway?')) return; }
  if(id){
    const s=refs.length?studentById(refs[0]):null;
    Object.assign(S.fees.find(x=>x.id===id),{...base,studentRef:s?s.id:null,studentId:s?s.sid:null,studentName:s?s.name:''});
    toast('Payment updated');
  } else if(refs.length>1){
    refs.forEach(r=>{ const s=studentById(r); S.fees.push({id:nid(),...base,studentRef:s?s.id:null,studentId:s?s.sid:null,studentName:s?s.name:''}); });
    toast(refs.length+' payments recorded');
  } else {
    const s=refs.length?studentById(refs[0]):null;
    S.fees.push({id:nid(),...base,studentRef:s?s.id:null,studentId:s?s.sid:null,studentName:s?s.name:''});
    toast('Payment recorded');
  }
  save(); closeOverlays();
  if(CUR==='finances') RENDER.finances();
  if(backToOp){ const o=backToOp; backToOp=null; openBatchOp(o); return; }
  if(document.querySelector('.drawer.on')&&curStudent) openStudent(curStudent);
}
function delFee(id){ S.fees=S.fees.filter(f=>f.id!==id); save(); closeOverlays(); if(CUR==='finances')RENDER.finances(); toast('Payment deleted'); }

function editExpense(id){

  openModal(`<div class="modal-h"><h3>${id?'Edit expense':'Add expense'}</h3><button class="x" onclick="closeOverlays()">${I.x}</button></div>
  <div class="modal-b">
    <div class="frow2">${field('Type',selEditable('e-type','expenseType',e.type))}${field('Amount (DA)',`<input type="number" id="e-amount" value="${e.amount||0}"/>`)}</div>

function saveExpense(id){

/* ===== CLOUD SYNC — shared Google Sheet via Apps Script ===== */
let cloud = cloudCfg();
let cloudStatus='off', _pushT=null, _pullT=null;
function cloudCfg(){ try{ const r=localStorage.getItem('dzbhub_cloud'); if(r)return JSON.parse(r); }catch(e){} return {url:'',token:''}; }
function cloudSaveCfg(c){ cloud=c; try{ localStorage.setItem('dzbhub_cloud',JSON.stringify(c)); }catch(e){} }
function cloudOn(){ return !!(cloud.url&&cloud.token); }
function setSync(s){ cloudStatus=s; const b=el('sync-badge'); if(b){ const m={off:'Local only',ok:'Synced ✓',syncing:'Syncing…',error:'Sync error',offline:'Offline'}; b.textContent=m[s]||s; b.className='sync-badge '+s; } }
async function cloudFetchState(){ const r=await fetch(cloud.url+'?action=load&token='+encodeURIComponent(cloud.token),{method:'GET'}); const j=await r.json(); if(!j.ok) throw new Error(j.error||'load failed'); return j.data; }
async function cloudPush(){
  if(!cloudOn())return; setSync('syncing');
  try{ S._rev=Date.now(); await fetch(cloud.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save',token:cloud.token,data:S})}); setSync('ok'); }
  catch(e){ setSync('offline'); }
}
function cloudSchedulePush(){ if(!cloudOn())return; clearTimeout(_pushT); _pushT=setTimeout(cloudPush,1500); }
async function cloudPull(silent){
  if(!cloudOn())return false;
  if(!silent)setSync('syncing');
  try{
    const data=await cloudFetchState();
    if(data){ const openUI=document.querySelector('.modal.on,.drawer.on'); if(!openUI){ if(JSON.stringify(data)!==JSON.stringify(S)){ S=migrate(data); uid=S._uid||uid; go(CUR); refreshBadges(); } } }
    setSync('ok'); return true;
  }catch(e){ setSync('offline'); return false; }
}
async function cloudBoot(){
  if(!cloudOn()){ setSync('off'); return; }
  setSync('syncing');
  try{
    const data=await cloudFetchState();
    const cloudHas = !!(data && data.students && data.students.length);
    const localHas = !!(S.students && S.students.length);
    // The shared cloud copy is the source of truth. Only ever seed it when it is
    // missing or empty — never overwrite real shared data automatically.
    if(cloudHas){ S=migrate(data); uid=S._uid||uid; go(CUR); refreshBadges(); setSync('ok'); }
    else if(localHas || !data){ await cloudPush(); }
    else if(data){ S=migrate(data); uid=S._uid||uid; go(CUR); refreshBadges(); setSync('ok'); }
    clearInterval(_pullT);
    _pullT=setInterval(()=>{ if(cloudOn()&&!document.querySelector('.modal.on,.drawer.on')) cloudPull(true); }, 25000);
  }catch(e){ setSync('offline'); }
}
function openSync(){
  openModal(`<div class="modal-h"><h3>Cloud sync (Google Sheet)</h3><button class="x" onclick="closeOverlays()">${I.x}</button></div>
  <div class="modal-b">
    <div class="mini" style="margin-bottom:12px"><div class="bd" style="color:var(--text)">Paste the Web App URL and secret token from your Google Sheet setup. Everyone who enters the <b>same two values</b> shares one live database. These are stored only on this device — never published.</div></div>
    ${field('Web App URL',`<input type="text" id="cl-url" value="${esc(cloud.url||'')}" placeholder="https://script.google.com/macros/s/…/exec"/>`)}
    ${field('Secret token',`<input type="text" id="cl-token" value="${esc(cloud.token||'')}" placeholder="the token you set in the script"/>`)}
    <div id="cl-status" class="sub" style="margin-top:6px"></div>
    <div class="mini" style="margin-top:14px;border-color:var(--gold)"><div class="top" style="color:var(--gold)">Fix a bad sync</div><div class="bd">If the shared data looks wrong, open the file that has the correct data and click below to load it and overwrite the cloud copy for everyone.</div><button class="btn sm" style="margin-top:8px" onclick="cloudResetPush()">Load this file's data & overwrite cloud</button></div>
  </div>
  <div class="modal-f">
    ${cloudOn()?`<button class="btn dng" onclick="cloudDisconnect()">Disconnect</button>`:''}
    <button class="btn" onclick="cloudPull(false).then(()=>{const s=el('cl-status');if(s)s.textContent=cloudStatus==='ok'?'Connected — data pulled.':'Could not reach the sheet.';})">Test / Pull now</button>
    <button class="btn pri" onclick="cloudConnect()">Save & connect</button>
  </div>`);
}
function cloudConnect(){
  const url=(el('cl-url').value||'').trim(), token=(el('cl-token').value||'').trim();
  if(!url||!token){ toast('Enter both the URL and token',1); return; }
  cloudSaveCfg({url,token}); closeOverlays(); toast('Connecting…'); cloudBoot();
}
function cloudDisconnect(){ cloudSaveCfg({url:'',token:''}); clearInterval(_pullT); setSync('off'); closeOverlays(); toast('Disconnected — local only'); }
function cloudResetPush(){
  if(!confirm("This loads the data built into THIS file (replacing what's on screen) and, if connected, overwrites the shared cloud copy with it. Use it to fix a bad sync. Continue?"))return;
  S=seedState(); uid=S._uid; try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
  closeOverlays(); go('dashboard'); refreshBadges();
  if(cloudOn()){ cloudPush(); toast('Built-in data loaded and pushed to cloud'); } else { toast('Built-in data reloaded'); }
}

/* ---- access gate (light front-door lock for sharing) ---- */
function doLogin(){ const id=(el('lg-id').value||'').trim().toLowerCase(), pw=el('lg-pw').value||''; if((id==='dzbrothers'||id==='dzbrothes')&&pw==='Dzbrothers520'){ try{sessionStorage.setItem('dzb_auth','1');}catch(e){} el('login').classList.add('hide'); showProfilePicker(); } else { el('lg-err').textContent='Wrong ID or password.'; } }
function showProfilePicker(){
  const g=el('profile-grid'); if(g){ g.innerHTML=PROFILES.map(n=>`<button class="profile-btn" onclick="pickProfile('${n}')"><span class="pav" style="background:${profileColor(n)}">${initials(n)}</span>${esc(n)}</button>`).join(''); }
  el('profile-screen').classList.remove('hide');
}
function pickProfile(n){ ME=n; try{sessionStorage.setItem('dzb_profile',n);}catch(e){} el('profile-screen').classList.add('hide'); updateWhoChip(); toast('Signed in as '+n); cloudBoot(); }
function updateWhoChip(){ const c=el('who-chip'); if(!c)return; el('who-name').textContent=ME||'—'; const d=c.querySelector('.who-dot'); if(d){ d.textContent=ME?initials(ME):'?'; d.style.background=profileColor(ME); } }
function logout(){ try{sessionStorage.removeItem('dzb_auth');sessionStorage.removeItem('dzb_profile');}catch(e){} ME=''; updateWhoChip(); el('lg-pw').value=''; el('lg-err').textContent=''; el('profile-screen').classList.add('hide'); el('login').classList.remove('hide'); el('side').classList.remove('on'); }
el('lg-go').onclick=doLogin;
el('lg-pw').onkeydown=e=>{ if(e.key==='Enter')doLogin(); };
el('lg-id').onkeydown=e=>{ if(e.key==='Enter')el('lg-pw').focus(); };
el('btn-logout').onclick=logout;
el('btn-sync').onclick=openSync;
try{
  const savedProfile=sessionStorage.getItem('dzb_profile')||'';
  if(sessionStorage.getItem('dzb_auth')==='1'){
    el('login').classList.add('hide');
    if(savedProfile){ ME=savedProfile; updateWhoChip(); cloudBoot(); }
    else showProfilePicker();
  } else { setSync(cloudOn()?'ok':'off'); setTimeout(()=>{const n=el('lg-id');if(n)n.focus();},100); }
}catch(e){}
const _wc=el('who-chip'); if(_wc)_wc.onclick=showProfilePicker;

refreshBadges(); go('dashboard');
